<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ArchAI — Parametrik Proje ve Teklif</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
:root{
  --void:#04070c;--glass:rgba(9,17,27,.66);
  --line:rgba(120,210,255,.13);--line-hi:rgba(120,210,255,.32);
  --ink:#e6f1f8;--mute:#7f98ab;--dim:#4d6475;
  --cy:#3ee8ff;--cy-soft:rgba(62,232,255,.14);--blue:#3d7bff;--ok:#3cffa6;--bad:#ff5d6c;--warn:#ffb547;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Space Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 700px at 70% -10%,rgba(61,123,255,.16),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,rgba(62,232,255,.08),transparent 60%),
    linear-gradient(rgba(62,232,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(62,232,255,.055) 1px,transparent 1px),
    linear-gradient(rgba(62,232,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(62,232,255,.022) 1px,transparent 1px);
  background-size:auto,auto,120px 120px,120px 120px,24px 24px,24px 24px;background-attachment:fixed}
::selection{background:var(--cy);color:#001018}
.mono{font-family:var(--mono)}

/* ---------- üst bar */
.bar{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(4,7,12,.9),rgba(4,7,12,.55));backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:11px}
.logo b{font-weight:700;letter-spacing:.2em;font-size:15px}
.logo small{display:block;font:500 10px var(--mono);color:var(--mute);letter-spacing:.16em}
.bar .sp{flex:1}
.chip{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--mute);border:1px solid var(--line);padding:5px 10px;border-radius:99px;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.chip.busy .dot{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.3}}

/* ---------- yerleşim */
.grid{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;padding:18px 22px 40px;max-width:1680px;margin:auto}
.grid>*,.stage>*{min-width:0}
.vp canvas{max-width:100%}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr);padding:12px 16px 30px}.bar{padding:12px 16px}.bar .chip.opt{display:none}.stage{order:-1}.vp{height:58vh;min-height:340px}}
.glass{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(16px) saturate(130%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 70px rgba(0,0,0,.5)}
/* mimari kesim işaretleri */
.glass::before,.glass::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border-color:var(--cy);opacity:.55}
.glass::before{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid;border-top-left-radius:14px}
.glass::after{bottom:-1px;right:-1px;border-bottom:1px solid;border-right:1px solid;border-bottom-right-radius:14px}
.pad{padding:18px}
.sec-t{font:600 10.5px var(--mono);letter-spacing:.18em;color:var(--cy);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}

/* ---------- form */
label{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:12px 0 5px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(2,6,11,.6);color:var(--ink);
  font:500 13.5px var(--mono);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px var(--cy-soft),0 0 18px rgba(62,232,255,.18)}
input[type=file]{font-size:12px;padding:8px}
select option{background:#0b1522}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;gap:9px;align-items:center;margin:14px 0 2px;font:500 12px var(--mono);color:var(--ink);text-transform:none;letter-spacing:.02em;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--cy)}
button{font:600 13px var(--sans);cursor:pointer;border:0;border-radius:9px;color:var(--ink);background:transparent;transition:transform .12s,box-shadow .2s,background .2s,color .2s}
button:active{transform:translateY(1px)}
.primary{width:100%;margin-top:16px;padding:13px;letter-spacing:.14em;font:600 12.5px var(--mono);color:#00131a;
  background:linear-gradient(100deg,var(--cy),#7ab6ff 60%,var(--blue));box-shadow:0 0 0 1px rgba(62,232,255,.5),0 10px 30px rgba(62,232,255,.22)}
.primary:hover{box-shadow:0 0 0 1px var(--cy),0 12px 40px rgba(62,232,255,.4)}
.primary:disabled{filter:grayscale(.7) brightness(.7);cursor:wait}
.ghost{display:inline-block;border:1px solid var(--line-hi);padding:8px 12px;color:var(--cy);font:500 11.5px var(--mono);letter-spacing:.08em;border-radius:9px;text-decoration:none}
.ghost:hover{background:var(--cy-soft)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:rgba(2,6,11,.55)}
.seg button{padding:8px 4px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--mute);border-radius:7px}
.seg button.on{color:#00131a;background:var(--cy);box-shadow:0 0 16px rgba(62,232,255,.35)}
.err{display:none;margin-top:10px;padding:9px 10px;border:1px solid rgba(255,93,108,.4);background:rgba(255,93,108,.08);color:var(--bad);border-radius:8px;font:500 12px var(--mono)}
.recent a{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:13px}
.recent a:hover{color:var(--cy)}.recent small{font:500 11px var(--mono);color:var(--mute);white-space:nowrap}

/* ---------- 3D sahne */
.stage{display:grid;gap:18px;min-width:0;align-content:start}
.vp{height:min(62vh,640px);min-height:380px;overflow:hidden;padding:0}
.vp canvas{display:block;width:100%;height:100%;border-radius:14px}
.hud{position:absolute;pointer-events:none;font-family:var(--mono)}
.hud *{pointer-events:auto}
.hud.tl{top:16px;left:18px}.hud.tr{top:14px;right:14px;display:flex;gap:6px}.hud.bl{left:18px;bottom:16px}.hud.br{right:16px;bottom:14px}
.hud .pname{font:600 20px var(--sans);letter-spacing:.01em;text-shadow:0 0 24px rgba(62,232,255,.35)}
.hud .meta{font-size:10.5px;letter-spacing:.14em;color:var(--mute);margin-top:3px}
.vbtn{font:500 10.5px var(--mono);letter-spacing:.12em;padding:7px 10px;border:1px solid var(--line-hi);background:rgba(4,8,14,.6);color:var(--mute);border-radius:7px;backdrop-filter:blur(6px)}
.vbtn.on{color:var(--cy);border-color:var(--cy);box-shadow:inset 0 0 12px rgba(62,232,255,.18)}
.stats{display:flex;gap:18px}
.stats div{min-width:110px}.stats small{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--mute)}
.stats b{font:600 17px var(--mono);color:var(--ink)}.stats b.hl{color:var(--cy);text-shadow:0 0 16px rgba(62,232,255,.4)}
.slider{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line-hi);border-radius:9px;background:rgba(4,8,14,.6);backdrop-filter:blur(6px);font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.slider input{width:160px;padding:0;accent-color:var(--cy);background:none;border:0;box-shadow:none}
.slider b{color:var(--cy);min-width:62px;font-weight:600}
@media (max-width:700px){.stats div:nth-child(n+2){display:none}.hud.bl{bottom:68px}.slider input{width:120px}
  .hud.tr{flex-wrap:wrap;justify-content:flex-end;max-width:48%}.hud.tl{max-width:50%}.hud .pname{font-size:16px}.hud .meta{font-size:9.5px}
}
.scan{position:absolute;inset:0;border-radius:14px;display:none;overflow:hidden;background:rgba(4,7,12,.35)}
.scan::before{content:"";position:absolute;left:0;right:0;height:120px;background:linear-gradient(180deg,transparent,rgba(62,232,255,.22),transparent);animation:scan 1.6s linear infinite}
@keyframes scan{from{top:-120px}to{top:100%}}
.scan div{position:absolute;inset:auto 0 50% 0;text-align:center;font:600 12px var(--mono);letter-spacing:.3em;color:var(--cy);text-shadow:0 0 18px var(--cy)}

/* ---------- modül paneli */
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:12px 13px 11px;font:500 11px var(--mono);letter-spacing:.12em;color:var(--mute);border-radius:0;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button i{font-style:normal;color:var(--dim);margin-right:6px}
.tabs button.on{color:var(--cy);border-color:var(--cy)}.tabs button.on i{color:var(--cy)}
.tabs button:hover{color:var(--ink)}
#view{padding:18px;min-height:220px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:linear-gradient(160deg,rgba(62,232,255,.06),transparent 55%)}
.kpi small{display:block;font:500 9.5px var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.kpi b{display:block;font:600 19px var(--mono);margin-top:5px}.kpi.hl b{color:var(--cy);text-shadow:0 0 18px rgba(62,232,255,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-hi);position:sticky;top:0;background:#08111b;z-index:1}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:rgba(62,232,255,.035)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.code{font:500 11.5px var(--mono);color:var(--cy)}
td input,td select{padding:6px 8px;font-size:12.5px}td input.num{width:112px;text-align:right}
.scroll{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.flag{display:inline-block;font:600 10px var(--mono);letter-spacing:.12em;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.warnbox{border:1px solid rgba(255,181,71,.35);background:rgba(255,181,71,.07);color:var(--warn);padding:9px 12px;border-radius:9px;font:500 12px var(--mono);margin-bottom:12px}
.note{color:var(--mute);font-size:12px;margin-top:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.totals{border:1px solid var(--line-hi);border-radius:11px;padding:14px;background:linear-gradient(160deg,rgba(62,232,255,.07),transparent 60%)}
.totals div{display:flex;justify-content:space-between;padding:5px 0;font:500 12.5px var(--mono);color:var(--mute)}
.totals div b{color:var(--ink);font-weight:500}
.totals .big{border-top:1px solid var(--line-hi);margin-top:6px;padding-top:10px;color:var(--ink)}
.totals .big b{font:600 20px var(--mono);color:var(--cy);text-shadow:0 0 18px rgba(62,232,255,.35)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.sheet{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#02070d;transition:border-color .2s,box-shadow .2s}
.sheet:hover{border-color:var(--cy);box-shadow:0 0 30px rgba(62,232,255,.15)}
.sheet img,.bp{filter:invert(1) sepia(1) saturate(4) hue-rotate(150deg) brightness(1.05) contrast(1.05)}
.sheet img{width:100%;display:block;cursor:zoom-in;aspect-ratio:1.414;object-fit:cover}
.sheet div{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
a{color:var(--cy)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.doc{display:block;padding:16px;border:1px solid var(--line);border-radius:11px;text-decoration:none;color:var(--ink);background:linear-gradient(160deg,rgba(62,232,255,.05),transparent 60%);transition:border-color .2s,transform .2s}
.doc:hover{border-color:var(--cy);transform:translateY(-2px)}
.doc small{display:block;font:500 10px var(--mono);letter-spacing:.14em;color:var(--cy);margin-bottom:6px}
.doc b{font-weight:600}.doc span{display:block;color:var(--mute);font-size:12px;margin-top:4px}
details{border:1px solid var(--line);border-radius:9px;margin-top:8px;padding:2px 10px}
summary{cursor:pointer;padding:9px 0;font:500 12px var(--mono);letter-spacing:.06em}
.renders{display:grid;grid-template-columns:1fr 1fr;gap:12px}.renders img{width:100%;border-radius:10px;border:1px solid var(--line)}
@media (max-width:700px){.renders{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--mute);padding:50px 10px;font:500 12px var(--mono);letter-spacing:.1em}
#zoom{position:fixed;inset:0;background:rgba(2,5,9,.92);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(6px)}
#zoom img{max-width:96vw;max-height:94vh;border:1px solid var(--line-hi);border-radius:8px}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:15px}}
@media (prefers-reduced-motion:reduce){.scan::before,.chip.busy .dot{animation:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#3ee8ff" stroke-width="1.4" aria-hidden="true">
      <path d="M17 3 30 10.5v13L17 31 4 23.5v-13Z" opacity=".9"/><path d="M17 3v28M4 10.5l13 7.5 13-7.5" opacity=".5"/><path d="M10.5 14.2v9.3M23.5 14.2v9.3" opacity=".35"/>
    </svg>
    <div><b>ARCHAI</b><small>PARAMETRİK PROJE · TEKLİF MOTORU</small></div>
  </div>
  <div class="sp"></div>
  <div class="chip opt">ARAZİ → PLAN → ÇİZİM → METRAJ → TEKLİF</div>
  <div class="chip" id="status"><span class="dot"></span><span id="stxt">SİSTEM HAZIR</span></div>
</header>

<main class="grid">
<aside style="display:grid;gap:18px;align-content:start">
  <div class="glass pad">
    <p class="sec-t">GİRDİ</p>
    <div class="seg" id="mode"><button data-m="land" class="on">ARAZİ</button><button data-m="quick">HIZLI m²</button><button data-m="dxf">DXF PLAN</button></div>
    <label for="name">Proje adı</label><input id="name" value="Yeni Konut Projesi">
    <div data-show="land">
      <div class="r2"><div><label for="pw">Parsel cephe · m</label><input id="pw" type="number" value="30"></div><div><label for="pd">Parsel derinlik · m</label><input id="pd" type="number" value="28"></div></div>
      <div class="r2"><div><label for="taks">TAKS</label><input id="taks" type="number" step="0.01" value="0.40"></div><div><label for="kaks">KAKS / Emsal</label><input id="kaks" type="number" step="0.05" value="2.00"></div></div>
      <div class="r3"><div><label for="fr">Ön çekme</label><input id="fr" type="number" value="5"></div><div><label for="sd">Yan çekme</label><input id="sd" type="number" value="3"></div><div><label for="rr">Arka çekme</label><input id="rr" type="number" value="3"></div></div>
      <div class="r2"><div><label for="mf">Maks. kat</label><input id="mf" type="number" value="6"></div><div><label for="fh">Kat yüksekliği · m</label><input id="fh" type="number" step="0.1" value="3.0"></div></div>
    </div>
    <div data-show="quick" hidden>
      <div class="r2"><div><label for="qa">Toplam brüt · m²</label><input id="qa" type="number" value="600"></div><div><label for="qf">Kat sayısı</label><input id="qf" type="number" value="3"></div></div>
    </div>
    <div data-show="land quick">
      <div class="r2"><div><label for="ut">Daire tipi</label><select id="ut"><option value="auto">Otomatik</option><option>1+1</option><option selected>2+1</option><option>3+1</option><option>4+1</option></select></div>
      <div><label for="upf">Kat başına daire</label><select id="upf"><option value="auto">Otomatik</option><option value="1">1</option><option value="2">2</option></select></div></div>
    </div>
    <div data-show="dxf" hidden>
      <label for="file">Plan · .dxf (DUVAR · PENCERE · KAPI · MAHAL)</label><input id="file" type="file" accept=".dxf">
      <div class="r2"><div><label for="df">Kat sayısı</label><input id="df" type="number" value="1"></div><div><label for="dfh">Kat yüksekliği · m</label><input id="dfh" type="number" step="0.1" value="3.0"></div></div>
    </div>
    <div class="r2"><div><label for="co">Firma</label><input id="co" placeholder="Firma adı"></div><div><label for="cu">Müşteri</label><input id="cu" placeholder="Müşteri adı"></div></div>
    <label class="check"><input id="r3d" type="checkbox"> Blender render + GLB de üret</label>
    <button class="primary" id="go">▶ PROJEYİ ÜRET</button>
    <div class="err" id="err"></div>
  </div>
  <div class="glass pad"><p class="sec-t">ARŞİV</p><div class="recent" id="recent"></div></div>
</aside>

<section class="stage">
  <div class="glass vp" id="vp">
    <canvas id="cv"></canvas>
    <div class="hud tl"><div class="pname" id="hname">—</div><div class="meta" id="hmeta">3D ÖN TASARIM</div></div>
    <div class="hud tr">
      <button class="vbtn on" data-vm="wire">TEL</button><button class="vbtn" data-vm="xray">X-RAY</button><button class="vbtn" data-vm="solid">KATI</button>
      <button class="vbtn on" id="rot" title="Otomatik döndür" aria-label="Otomatik döndür">⟳</button><button class="vbtn" id="fit" title="Kadrajı sıfırla" aria-label="Kadrajı sıfırla">⌖</button>
    </div>
    <div class="hud bl"><div class="stats" id="hstats"></div></div>
    <div class="hud br"><div class="slider"><span>KESİT</span><input id="lv" type="range" min="1" max="1" value="1" aria-label="Gösterilen kat"><b id="lvt">—</b></div></div>
    <div class="scan" id="scan"><div id="scantxt">PLAN ÜRETİLİYOR</div></div>
  </div>
  <div class="glass">
    <div class="tabs" id="tabs">
      <button data-t="ozet" class="on"><i>01</i>ÖZET</button><button data-t="cizim"><i>02</i>ÇİZİMLER</button><button data-t="metraj"><i>03</i>METRAJ</button>
      <button data-t="maliyet"><i>04</i>MALİYET · FİYAT</button><button data-t="belge"><i>05</i>BELGELER</button><button data-t="3d"><i>06</i>RENDER</button>
    </div>
    <div id="view"><div class="empty">SOLDAN BİLGİLERİ GİRİP “PROJEYİ ÜRET”E BASIN</div></div>
  </div>
</section>
</main>
<div id="zoom"><img alt=""></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const tl=v=>v==null?'—':v.toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0});
const n2=v=>v==null?'—':Number(v).toLocaleString('tr-TR',{maximumFractionDigits:2});
const SHEET={vaziyet:'Vaziyet planı',zemin_kat_plani:'Zemin kat planı',normal_kat_plani:'Normal kat planı',kesit_AA:'A-A kesiti',on_gorunus:'Ön görünüş'};
let mode='land', P=null, tab='ozet', adj={}, timer=null;

/* ================================================================ 3D viewport */
const V={};
function initViewport(){
  const cv=$('#cv'), host=$('#vp');
  const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});

  V.mat={

    edgeDim:new THREE.LineBasicMaterial({color:0x3ee8ff,transparent:true,opacity:.28}),

  const resize=()=>{const w=host.clientWidth,h=host.clientHeight;R.setSize(w,h,false);comp.setSize(w,h);bloom.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix();};
  new ResizeObserver(resize).observe(host); resize();
  // katlar sırayla yükselir: grup ofseti + malzeme opaklığı yerine görünürlük/ölçek (paylaşılan malzemeler bozulmasın)
  const loop=()=>{
    requestAnimationFrame(loop); O.update();
    const now=performance.now();
    V.levels.forEach((L,i)=>{
      const k=Math.min(1,Math.max(0,(now-V.t0-i*140)/650)), e=1-Math.pow(1-k,3);

function setMode(m){
  V.mode=m; const M=V.mat;
  M.face.opacity={wire:0,xray:.10,solid:.94}[m]; M.face.depthWrite=m==='solid';
  M.slab.opacity={wire:.05,xray:.14,solid:.97}[m]; M.slab.depthWrite=m==='solid';
  M.edge.opacity=m==='solid'?.6:.8; M.edgeIn.opacity={wire:.16,xray:.22,solid:.12}[m];
  V.bloom.strength=(m==='solid'?.25:.45)*(V.dense?.6:1);
}

// eleman listesi → sahne (plan x,y,z → three x, z, -y)
function edgesOf(geo,mat){return new THREE.LineSegments(new THREE.EdgesGeometry(geo,20),mat);}
function addBox(g,cx,cy,z0,L,T,H,ang,faceMat,edgeMat){
  const geo=new THREE.BoxGeometry(L,H,T);
  const grp=new THREE.Group(); grp.position.set(cx,z0+H/2,-cy); grp.rotation.y=ang;
  grp.add(new THREE.Mesh(geo,faceMat), edgesOf(geo,edgeMat)); g.add(grp);
}
function buildWall(g,w){
  const [x0,y0]=w.start,[x1,y1]=w.end, L=Math.hypot(x1-x0,y1-y0); if(L<1e-4)return;
  const ux=(x1-x0)/L, uy=(y1-y0)/L, ang=Math.atan2(uy,ux), T=w.thickness||.2, H=w.height||2.8, zb=w.base_z||0;
  const at=s=>[x0+ux*s,y0+uy*s];
  const em=T>=.2?V.mat.edge:V.mat.edgeIn;  // iç bölme duvarları sönük: yoğun planda parlama sisi olmasın
  const seg=(a,b,za,zt)=>{if(b-a<1e-3||zt-za<1e-3)return;const [cx,cy]=at((a+b)/2);addBox(g,cx,cy,zb+za,b-a,T,zt-za,ang,V.mat.face,em);};
  let cur=0; const ops=[...(w.openings||[])].sort((a,b)=>a.offset-b.offset);
  for(const o of ops){
    const a=o.offset,b=a+o.width,door=o.kind==='door',sill=door?0:(o.sill??.9),top=sill+(o.height??(door?2.1:1.4));
    seg(cur,a,0,H); seg(a,b,0,sill); seg(a,b,top,H);
    if(!door){const [cx,cy]=at((a+b)/2);const p=new THREE.Mesh(new THREE.PlaneGeometry(b-a,top-sill),V.mat.glass);p.position.set(cx,zb+(sill+top)/2,-cy);p.rotation.y=ang;g.add(p);}
    cur=b;
  }
  seg(cur,L,0,H);
}
function shapeOf(pts){const s=new THREE.Shape();pts.forEach(([x,y],i)=>i?s.lineTo(x,y):s.moveTo(x,y));s.closePath();return s;}
function buildSlab(g,e){
  const t=e.thickness||.2, pts=e.points, role=e.role;
  if(role==='site'){
    const ring=[...pts,pts[0]].map(([x,y])=>new THREE.Vector3(x,.03,-y));
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring),V.mat.edgeSite));
    const m=new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(pts)),V.mat.site);m.rotation.x=-Math.PI/2;m.position.y=.02;g.add(m);
    return;
  }
  const geo=new THREE.ExtrudeGeometry(shapeOf(pts),{depth:t,bevelEnabled:false});
  const m=new THREE.Mesh(geo,e.tag==='water'?V.mat.glass:V.mat.slab);
  m.rotation.x=-Math.PI/2; m.position.y=(e.z||0)-t;
  const ed=edgesOf(geo,role==='paving'?V.mat.edgeDim:V.mat.edge); ed.rotation.x=-Math.PI/2; ed.position.y=m.position.y;
  g.add(m,ed);
}
function build(elements,zoning){
  V.root.clear(); V.levels=[]; V.dense=elements.filter(e=>e.type==='wall').length>150;
  const byLevel=new Map(), lvlOf=e=>e.level||'0';
  for(const e of elements){
    if(!byLevel.has(lvlOf(e)))byLevel.set(lvlOf(e),{name:lvlOf(e),z:1e9,items:[]});
    const L=byLevel.get(lvlOf(e)); L.items.push(e);
    const z=e.type==='slab'?(e.z||0):e.type==='wall'?(e.base_z||0):(e.z??(e.origin?e.origin[2]:1e9));
    L.z=Math.min(L.z,z);
  }
  const site=byLevel.get('Arsa'); byLevel.delete('Arsa');
  const lv=[...byLevel.values()].sort((a,b)=>a.z-b.z);
  const mk=L=>{const group=new THREE.Group();for(const e of L.items){
    if(e.type==='wall')buildWall(group,e);
    else if(e.type==='slab')buildSlab(group,e);
    else if(e.type==='box'){const [ox,oy,oz]=e.origin,[sx,sy,sz]=e.size;addBox(group,ox+sx/2,oy+sy/2,oz,sx,sy,sz,0,V.mat.face,V.mat.edge);}
    else if(e.type==='stairs'){const [ox,oy,oz]=e.origin,r=(e.rotation_z||0)*Math.PI/180,run=e.run||.28,w=e.width||1.2;
      for(let i=0;i<(e.steps||10);i++){const d=(i+.5)*run,cx=ox+Math.cos(r)*d-Math.sin(r)*w/2,cy=oy+Math.sin(r)*d+Math.cos(r)*w/2;addBox(group,cx,cy,oz,run,w,(i+1)*(e.rise||.17),r,V.mat.face,V.mat.edgeDim);}}
    else if(e.type==='tree'){const [x,y]=e.position,h=e.height||5;const m=new THREE.Mesh(new THREE.IcosahedronGeometry(h*.28,1),V.mat.tree);m.position.set(x,(e.base_z||0)+h*.65,-y);group.add(m);}
  }
  V.root.add(group);return {name:L.name,group,show:true,site:false};};
  if(site){
    const s=mk(site); s.site=true;
    const pr=site.items.find(e=>e.name==='parsel');
    if(pr&&zoning&&zoning.front!=null){  // imar çekme hattı
      const W=pr.points[1][0],D=pr.points[2][1],f=zoning.front,sd=zoning.side,r=zoning.rear;
      const pts=[[sd,f],[W-sd,f],[W-sd,D-r],[sd,D-r],[sd,f]].map(([x,y])=>new THREE.Vector3(x,.05,-y));
      const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),V.mat.edgeSet); ln.computeLineDistances(); s.group.add(ln);
    }
    V.levels.push(s);
  }
  lv.forEach(L=>V.levels.push(mk(L)));
  V.nLv=lv.map(l=>l.name);
  const sl=$('#lv'); sl.max=Math.max(1,lv.length); sl.value=sl.max;
  const box=new THREE.Box3(); V.levels.filter(L=>!L.site).forEach(L=>box.expandByObject(L.group));
  if(box.isEmpty())V.levels.forEach(L=>box.expandByObject(L.group));
  const c=box.getCenter(new THREE.Vector3()); V.root.position.set(-c.x,0,-c.z);
  V.box=box.translate(new THREE.Vector3(-c.x,0,-c.z));
  setMode(V.mode); applyLevels(); fit(); V.t0=performance.now();
}
function applyLevels(){
  const n=+$('#lv').value; let i=0;
  V.levels.forEach(L=>{if(L.site){L.show=true;return;}i++;L.show=i<=n;});
  $('#lvt').textContent=V.nLv?.length?(V.nLv[n-1]||'—').toUpperCase():'—';
}
function fit(){
  const b=V.box; if(!b)return; const s=b.getSize(new THREE.Vector3());
  const d=(Math.max(s.x,s.y*1.3,s.z)*1.75+8)*Math.max(1,1.2/V.C.aspect);  // dikey ekranda uzaklaş
  V.O.target.set(0,s.y*.38,0); V.C.position.set(-d*.62,d*.5+s.y*.3,d*.78); V.C.lookAt(V.O.target);
}
function demoElements(){  // proje yokken: demo kule
  const els=[{type:'slab',name:'parsel',role:'site',level:'Arsa',points:[[0,0],[40,0],[40,34],[0,34]],z:0,thickness:.2}];
  const W=22,D=13,ox=9,oy=6,fh=3.2,P=(x,y)=>[ox+x,oy+y];
  const win=n=>Array.from({length:n},(_,i)=>({offset:.6+i*(W-1.2)/n,width:(W-1.2)/n-.6,kind:'window',sill:.4,height:2.2}));
  for(let f=0;f<9;f++){const z=f*fh,level='Kat '+f;
    els.push({type:'slab',level,role:'floor',points:[P(0,0),P(W,0),P(W,D),P(0,D)],z,thickness:.25},
      {type:'wall',level,start:P(0,0),end:P(W,0),thickness:.25,height:fh-.25,base_z:z,openings:win(7)},
      {type:'wall',level,start:P(W,0),end:P(W,D),thickness:.25,height:fh-.25,base_z:z,openings:[{offset:1,width:D-2,kind:'window',sill:.4,height:2.2}]},
      {type:'wall',level,start:P(W,D),end:P(0,D),thickness:.25,height:fh-.25,base_z:z,openings:win(7)},
      {type:'wall',level,start:P(0,D),end:P(0,0),thickness:.25,height:fh-.25,base_z:z});}
  els.push({type:'slab',level:'Çatı',role:'roof',points:[P(0,0),P(W,0),P(W,D),P(0,D)],z:9*fh,thickness:.3});
  return els;
}

      <div style="margin-top:12px"><button class="ghost" id="addx">+ EK KALEM</button></div>
      <div class="cols"><div>
        <div class="r3"><div><label>Genel gider %</label><input data-pct="overhead_pct" type="number" value="${c.overhead_pct}"></div><div><label>Kâr %</label><input data-pct="profit_pct" type="number" value="${c.profit_pct}"></div><div><label>KDV %</label><input data-pct="vat_pct" type="number" value="${c.vat_pct}"></div></div>
        ${c.approx?`<label>Kontrol · yaklaşık m² maliyet sınıfı</label><select id="apc">${Object.entries(c.approx.classes).map(([k,v])=>`<option ${k===c.approx.class?'selected':''} value="${k}">${k} — ${tl(v)}/m²</option>`).join('')}</select>
        <p class="note mono">${n2(c.approx.area)} m² × ${tl(c.approx.unit_cost)} = ${tl(c.approx.amount)} · metraj bazlı ara toplam ${tl(c.subtotal)}</p>`:''}
        <p class="note">${c.note||''}</p></div>
      <div class="totals"><div>Ara toplam<b>${tl(c.subtotal)}</b></div><div>Genel gider %${c.overhead_pct}<b>${tl(c.overhead)}</b></div><div>Kâr %${c.profit_pct}<b>${tl(c.profit)}</b></div>
        <div>KDV hariç<b>${tl(c.total_before_vat)}</b></div><div>KDV %${c.vat_pct}<b>${tl(c.vat)}</b></div><div class="big">GENEL TOPLAM<b>${tl(c.total)}</b></div><div>m² · KDV dahil<b>${tl(c.per_m2)}</b></div></div></div>`;
    const set=(k,code,val)=>{adj[k]=adj[k]||{};adj[k][code]=val;};
    $$('[data-up]').forEach(i=>i.onchange=()=>{set('overrides',i.dataset.up,parseFloat(i.value));push();});
    $$('[data-qty]').forEach(i=>i.onchange=()=>{set('qty_overrides',i.dataset.qty,parseFloat(i.value));push();});
    $$('[data-var]').forEach(i=>i.onchange=()=>{set('variants',i.dataset.var,i.value);if(adj.overrides)delete adj.overrides[i.dataset.var];push();});
    $$('[data-dis]').forEach(i=>i.onchange=()=>{const d=new Set(adj.disabled||[]);i.checked?d.delete(i.dataset.dis):d.add(i.dataset.dis);adj.disabled=[...d];push();});
    $$('[data-pct]').forEach(i=>i.onchange=()=>{adj[i.dataset.pct]=parseFloat(i.value);push();});
    if($('#apc'))$('#apc').onchange=e=>{adj.approx_class=e.target.value;push();};
    $('#addx').onclick=()=>{const nm=prompt('Kalem adı');if(!nm)return;const q=parseFloat(prompt('Miktar','1'))||1,p=parseFloat(prompt('Birim fiyat (₺)','0'))||0,u=prompt('Birim','götürü')||'götürü';
      adj.extra_items=[...(adj.extra_items||[]),{name:nm,quantity:q,unit_price:p,unit:u}];push();};
  }else if(tab==='belge'){
    const D=[['TEKLİF','Teklif mektubu','.docx · kapsam, bedel, ödeme planı',P.files.teklif_docx],['MALİYET','Metraj + maliyet','.xlsx · formüllü',P.files.metraj_maliyet_xlsx],
             ['ŞARTNAME','Teknik şartname','.docx · malzeme, uygulama, ölçü',P.files.sartname_docx],['ÇİZİM','Tüm paftalar','.pdf · A3',P.files.cizim_pdf]];
    out.innerHTML=`<div class="docs">${D.map(d=>`<a class="doc" href="${d[3]}" ${d[3].endsWith('.pdf')?'target="_blank"':''}><small>${d[0]} ↓</small><b>${d[1]}</b><span>${d[2]}</span></a>`).join('')}</div>
      <p class="note">Maliyet sekmesindeki her değişiklik bu belgeleri yeniden üretir.</p>`;
  }else if(tab==='3d'){
    out.innerHTML=P.files.preview_png?`<div class="renders"><figure style="margin:0"><img src="${P.files.preview_png}" alt="Blender önizleme"><figcaption class="note mono">BLENDER ÖNİZLEME</figcaption></figure>
      <figure style="margin:0"><img src="${P.files.colormap_png}" alt="Malzeme renk haritası"><figcaption class="note mono">MALZEME RENK HARİTASI · AI VİDEO KONTROL GÖRÜNTÜSÜ</figcaption></figure></div>
      <div style="margin-top:12px"><a class="ghost" href="${P.files.model_glb}">↓ MODEL · GLB</a></div>`
      :`<div class="empty">BLENDER RENDER HENÜZ ALINMADI<br><br><button class="ghost" id="mk3d">▶ BLENDER İLE ÜRET</button></div>`;
    if($('#mk3d'))$('#mk3d').onclick=async e=>{e.target.disabled=true;e.target.textContent='ÜRETİLİYOR…';busy(true);try{P=await api(`/api/projects/${P.id}/render`,{method:'POST'});render();}catch(x){fail(x)}finally{busy(false)}};
  }
}
function push(){clearTimeout(timer);timer=setTimeout(async()=>{try{$('#status').classList.add('busy');P=await api(`/api/projects/${P.id}/adjust`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(adj)});hud();render();recent();}catch(e){fail(e)}finally{$('#status').classList.remove('busy')}},300);}
$('#zoom').onclick=()=>$('#zoom').style.display='none';

initViewport();
recent();
const Q_=new URLSearchParams(location.search), tabQ=Q_.get('tab'), vmQ=Q_.get('vm');
if(tabQ)$(`#tabs [data-t="${tabQ}"]`)?.click();
if(vmQ)$(`[data-vm="${vmQ}"]`)?.click();
const demo=()=>{build(demoElements());$('#hname').textContent='ArchAI';$('#hmeta').textContent='DEMO · PROJE ÜRETMEK İÇİN SOLDAKİ FORMU KULLANIN';};
if(location.hash.length>1)openP(location.hash.slice(1)).catch(demo); else demo();
</script>
</body>
</html>
