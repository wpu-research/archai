[project]
name = "archai"
version = "0.1.0"
description = "LLM ajanı → Blender mimari modelleme → colormap → AI video prototipi"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "ezdxf>=1.4.4",
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "mcp>=2.2",
    "openpyxl>=3.1.5",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "shapely>=2.1.2",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
